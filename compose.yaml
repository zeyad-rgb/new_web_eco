services:
  app:
    build: { context: ., dockerfile: deploy/Dockerfile, target: php }
    env_file: .env.production
    volumes: [media:/var/www/backend/storage/app/product-media]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
  worker:
    build: { context: ., dockerfile: deploy/Dockerfile, target: php }
    env_file: .env.production
    command: php artisan queue:work --tries=3 --timeout=30 --sleep=1
    volumes: [media:/var/www/backend/storage/app/product-media]
    depends_on: [app]
    restart: unless-stopped
  web:
    build: { context: ., dockerfile: deploy/Dockerfile, target: web }
    ports: ["127.0.0.1:8080:80"]
    depends_on: [app]
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in compose environment}
    volumes: [database:/var/lib/postgresql/data]
    healthcheck: { test: [CMD-SHELL, "pg_isready -U studio"], interval: 5s, timeout: 3s, retries: 10 }
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    healthcheck: { test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 10 }
    restart: unless-stopped
volumes:
  database:
  redis-data:
  media:
